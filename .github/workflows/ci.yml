name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: Create CI environment file
        run: |
          echo "DB_USER=postgres" >> server/.env
          echo "DB_PASSWORD=test_password" >> server/.env
          echo "DB_NAME=incident_management" >> server/.env
          echo "SESSION_SECRET=ci_test_secret" >> server/.env
      
      - name: Start application
        run: docker compose --env-file ./server/.env up -d --build

      - name: Check Node version
        run: node --version

      - name: Show running containers
        run: docker compose ps

      